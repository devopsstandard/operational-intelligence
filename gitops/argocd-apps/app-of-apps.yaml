apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omnipulse-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/devopsstandard/operational-intelligence.git
    targetRevision: dev
    path: gitops/argocd-apps
    directory:
      exclude: 'app-of-apps.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
