apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.slack: operational-intelligence
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: operational-intelligence
    notifications.argoproj.io/subscribe.on-sync-failed.slack: operational-intelligence
    notifications.argoproj.io/subscribe.on-health-degraded.slack: operational-intelligence
spec:
  project: default
  source:
    repoURL: https://github.com/devopsstandard/operational-intelligence.git
    targetRevision: dev
    path: k8s/grafana-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
