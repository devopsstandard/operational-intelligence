apiVersion: v1
kind: ConfigMap
metadata:
  name: robusta-auditor-script
  namespace: robusta
data:
  auditor.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json
    import os
    import datetime
    import uuid
    import urllib.request
    import urllib.error

    try:
        from google.cloud import bigquery
    except ImportError:
        bigquery = None

    PROJECT_ID = os.environ.get("GCP_PROJECT", "festive-ally-443007-r4")
    DATASET_ID = os.environ.get("BQ_DATASET", "ops_analytics_dev")
    TABLE_NAME = "operational_remediation_audit"
    TABLE_ID = f"{PROJECT_ID}.{DATASET_ID}.{TABLE_NAME}"

    print(f"==> Initializing BigQuery Auditor for {TABLE_ID}...")
    client = None
    if bigquery is not None:
        try:
            client = bigquery.Client(project=PROJECT_ID)
            print("==> Google Cloud BigQuery client initialized.")
        except Exception as e:
            print(f"==> Notice: BigQuery SDK client init deferred: {e}")

    def get_metadata_access_token():
        try:
            req = urllib.request.Request(
                "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",
                headers={"Metadata-Flavor": "Google"}
            )
            with urllib.request.urlopen(req, timeout=3) as resp:
                data = json.loads(resp.read().decode('utf-8'))
                return data.get("access_token")
        except Exception as e:
            print(f"==> Notice: Could not fetch metadata token: {e}")
            return None

    def insert_records_rest(rows):
        token = get_metadata_access_token()
        if not token:
            print("==> Warning: No access token available for BigQuery REST API insert.")
            return False
        url = f"https://bigquery.googleapis.com/bigquery/v2/projects/{PROJECT_ID}/datasets/{DATASET_ID}/tables/{TABLE_NAME}/insertAll"
        body = {
            "kind": "bigquery#tableDataInsertAllRequest",
            "rows": [{"insertId": str(uuid.uuid4()), "json": r} for r in rows]
        }
        req = urllib.request.Request(
            url,
            data=json.dumps(body).encode('utf-8'),
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json"
            }
        )
        try:
            with urllib.request.urlopen(req, timeout=10) as resp:
                res = json.loads(resp.read().decode('utf-8'))
                if "insertErrors" in res and res["insertErrors"]:
                    print("==> BigQuery REST insert errors:", res["insertErrors"])
                    return False
                print(f"==> [SUCCESS] Persisted {len(rows)} audit row(s) to BigQuery via REST API.")
                return True
        except Exception as e:
            print(f"==> BigQuery REST insert error: {e}")
            return False

    class AuditHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get('content-length', 0))
            body = self.rfile.read(length)
            try:
                payload = json.loads(body.decode('utf-8'))
                print("==> Received alert webhook:", json.dumps(payload)[:300])

                alerts = payload.get("alerts", [payload])
                rows = []
                for item in alerts:
                    labels = item.get("labels", {})
                    annotations = item.get("annotations", {})

                    failure_mode = labels.get("alertname", item.get("title", "PROACTIVE_ANOMALY_REMEDIATION"))
                    target_workload = labels.get("deployment", labels.get("app", labels.get("workload", "emailservice")))
                    summary = annotations.get("summary", annotations.get("description", item.get("description", "Metric breach detected by Prometheus; autonomous self-healing remediation initiated.")))

                    row = {
                        "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        "incident_id": f"sre-{str(uuid.uuid4())[:8]}",
                        "failure_mode": failure_mode,
                        "target_workload": target_workload,
                        "diagnosis_summary": summary[:1000],
                        "action_executed": "ROLLOUT_RESTART",
                        "execution_type": "AUTOMATED",
                        "operator": "SYSTEM_ROBUSTA",
                        "status": "SUCCESS",
                        "raw_telemetry": json.dumps(item)[:2000]
                    }
                    rows.append(row)

                persisted = False
                if client and rows:
                    try:
                        errs = client.insert_rows_json(TABLE_ID, rows)
                        if not errs:
                            persisted = True
                            print(f"==> [SUCCESS] Logged {len(rows)} audit record(s) via SDK.")
                    except Exception:
                        pass
                
                if not persisted and rows:
                    insert_records_rest(rows)

            except Exception as e:
                print(f"==> Error processing incoming audit webhook: {e}")

            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(b'{"status":"audit_processed"}')

        def do_GET(self):
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(b'{"status":"healthy"}')

        def log_message(self, format, *args):
            return  # Suppress default noisy access logs

    def run():
        server_address = ('0.0.0.0', 8080)
        httpd = HTTPServer(server_address, AuditHandler)
        print("==> Robusta BigQuery Auditor listening on port 8080...")
        httpd.serve_forever()

    if __name__ == '__main__':
        run()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robusta-bigquery-auditor
  namespace: robusta
  labels:
    app: robusta-bigquery-auditor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robusta-bigquery-auditor
  template:
    metadata:
      labels:
        app: robusta-bigquery-auditor
      annotations:
        checksum/config: "v2-rest-resilient"
    spec:
      serviceAccountName: robusta-runner-service-account
      containers:
        - name: auditor
          image: robustadev/robusta-runner:0.18.0
          command: ["python3", "/opt/auditor/auditor.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GCP_PROJECT
              value: "festive-ally-443007-r4"
            - name: BQ_DATASET
              value: "ops_analytics_dev"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: script-vol
              mountPath: /opt/auditor
      volumes:
        - name: script-vol
          configMap:
            name: robusta-auditor-script
---
apiVersion: v1
kind: Service
metadata:
  name: robusta-bigquery-auditor
  namespace: robusta
  labels:
    app: robusta-bigquery-auditor
spec:
  type: ClusterIP
  selector:
    app: robusta-bigquery-auditor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
