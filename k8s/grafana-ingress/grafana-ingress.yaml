apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "boutique-grafana-ip-dev"
    # networking.gke.io/managed-certificates: "grafana-cert-v1"
spec:
  rules:
  - host: grafana.devopsstandard.name.ng
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: kube-prometheus-stack-grafana
            port:
              number: 80
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grafana-backendconfig
  namespace: monitoring
spec:
  healthCheck:
    type: HTTP
    port: 3000
    requestPath: /api/health
