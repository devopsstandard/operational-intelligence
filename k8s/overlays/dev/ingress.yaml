apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: dev-frontend-cert-v2
  namespace: boutique-dev
spec:
  domains:
    - dev.devopsstandard.name.ng
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-frontend-ingress
  namespace: boutique-dev
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "boutique-frontend-ip-dev"
    networking.gke.io/managed-certificates: "dev-frontend-cert-v2"
spec:
  rules:
  - host: dev.devopsstandard.name.ng
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 80
