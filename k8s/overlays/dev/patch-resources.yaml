# GKE Autopilot Dev Workloads Patch
# Recreate strategy ensures zero duplicate surge pods
# Soft-tolerates Spot Pods without forcing hard nodeSelector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      tolerations:
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: server
        env:
        - name: ENV_PLATFORM
          value: "gke-dev"
---
