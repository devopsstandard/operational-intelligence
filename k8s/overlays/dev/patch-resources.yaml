apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: server
        env:
        - name: ENV_PLATFORM
          value: "gke-dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: main
        env:
        - name: USERS
          value: "5"
