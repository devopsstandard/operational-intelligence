# GKE Autopilot Dev Workloads Patch
# Utilizes Spot Pods (cloud.google.com/gke-spot) for 60-91% cost reduction in Dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: server
        env:
        - name: ENV_PLATFORM
          value: "gke-dev"
---
