apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector-monitor
  namespace: opentelemetry
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: omnipulse-observability
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
  - port: prom-metrics
    interval: 15s
    scrapeTimeout: 10s
    path: /metrics
