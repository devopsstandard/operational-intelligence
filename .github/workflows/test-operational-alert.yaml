name: Trigger SRE Operational Alert (Live Demo)

on:
  workflow_dispatch:
    inputs:
      alert_name:
        description: 'Synthetic SRE Alert to simulate'
        required: true
        default: 'ConsumerTriageStalled'
        type: choice
        options:
          - ConsumerTriageStalled
          - FrontendHTTP5xxRateHigh
          - ContainerMemoryNearLimit
      severity:
        description: 'Alert Severity'
        required: true
        default: 'critical'
        type: choice
        options:
          - critical
          - warning

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1

jobs:
  dispatch-alert:
    name: Dispatch Simulated Incident to Robusta
    runs-on: ubuntu-latest
    steps:
      - name: Configure Dynamic Environment Context
        run: |
          PROJ_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJ_ID" ]; then
            echo "::error::Secret GCP_PROJECT_ID is not configured in GitHub Repository Secrets!"
            exit 1
          fi
          echo "GCP_PROJECT=${PROJ_ID}" >> $GITHUB_ENV

          PROJ_NUM="${{ secrets.GCP_PROJECT_NUMBER }}"
          echo "GCP_PROJECT_NUMBER=${PROJ_NUM}" >> $GITHUB_ENV

          ENV_NAME="dev"
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "GKE_CLUSTER=boutique-gke-cluster-${ENV_NAME}" >> $GITHUB_ENV

          CUSTOM_WIF="${{ secrets.WIF_PROVIDER }}"
          if [ -n "$CUSTOM_WIF" ]; then
            echo "WIF_PROVIDER=${CUSTOM_WIF}" >> $GITHUB_ENV
          elif [ -n "$PROJ_NUM" ]; then
            echo "WIF_PROVIDER=projects/${PROJ_NUM}/locations/global/workloadIdentityPools/github-actions-pool-${ENV_NAME}/providers/github-actions-provider" >> $GITHUB_ENV
          fi

          CUSTOM_SA="${{ secrets.WIF_SERVICE_ACCOUNT }}"
          if [ -n "$CUSTOM_SA" ]; then
            echo "WIF_SERVICE_ACCOUNT=${CUSTOM_SA}" >> $GITHUB_ENV
          else
            echo "WIF_SERVICE_ACCOUNT=boutique-cicd-sa-${ENV_NAME}@${PROJ_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
          fi

      - name: Authenticate to GCP (WIF with SA Key Fallback)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_SA_KEY == '' && env.WIF_PROVIDER || '' }}
          service_account: ${{ secrets.GCP_SA_KEY == '' && env.WIF_SERVICE_ACCOUNT || '' }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Send Synthetic Incident to In-Cluster Robusta & Alertmanager
        run: |
          ALERT_NAME="${{ github.event.inputs.alert_name || 'ConsumerTriageStalled' }}"
          SEVERITY="${{ github.event.inputs.severity || 'critical' }}"
          echo "==> Dispatching simulated incident '${ALERT_NAME}' with severity '${SEVERITY}'..."

          ROBUSTA_POD=$(kubectl get pods -n robusta -l app=robusta-runner -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$ROBUSTA_POD" ]; then
            echo "::error::Robusta runner pod not found in namespace robusta!"
            exit 1
          fi
          echo "==> Target Robusta runner pod: ${ROBUSTA_POD}"

          kubectl exec -i -n robusta "$ROBUSTA_POD" -- python3 - "$ALERT_NAME" "$SEVERITY" << 'EOF'
import sys, json, urllib.request, urllib.error
from datetime import datetime, timezone

alert_name = sys.argv[1]
severity = sys.argv[2]
now_iso = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

payload = {
    "version": "4",
    "groupKey": f"{{}}:{{alertname=\"{alert_name}\"}}",
    "truncatedAlerts": 0,
    "status": "firing",
    "receiver": "robusta-webhook",
    "groupLabels": {
        "alertname": alert_name,
        "namespace": "omnipulse-dev"
    },
    "commonLabels": {
        "alertname": alert_name,
        "severity": severity,
        "namespace": "omnipulse-dev"
    },
    "commonAnnotations": {
        "summary": f"Simulated SRE Incident: {alert_name}",
        "description": "Live operational intelligence test dispatched via CI/CD pipeline."
    },
    "externalURL": "http://alertmanager-operated.monitoring.svc.cluster.local:9093",
    "alerts": [
        {
            "status": "firing",
            "labels": {
                "alertname": alert_name,
                "severity": severity,
                "namespace": "omnipulse-dev",
                "pod": "frontend-simulated",
                "target_workload": "frontend"
            },
            "annotations": {
                "summary": f"Simulated SRE Incident: {alert_name}",
                "description": "Live operational intelligence test dispatched via CI/CD pipeline. Validating Prometheus Alertmanager webhook routing, Gemini 1.5 Flash RCA, and Slack ChatOps dispatch."
            },
            "startsAt": now_iso,
            "generatorURL": "http://prometheus-operated.monitoring.svc.cluster.local:9090",
            "fingerprint": "1234567890abcdef"
        }
    ]
}

data = json.dumps(payload).encode('utf-8')
req = urllib.request.Request(
    'http://127.0.0.1:5000/api/alerts',
    data=data,
    headers={'Content-Type': 'application/json'}
)

try:
    with urllib.request.urlopen(req, timeout=30) as resp:
        print(f"==> Robusta Webhook Response: {resp.status} {resp.reason}")
        body = resp.read().decode('utf-8', errors='replace')
        if body:
            print(f"==> Response details: {body}")
except urllib.error.HTTPError as e:
    print(f"::error::Robusta Webhook returned HTTP {e.code}: {e.reason}", file=sys.stderr)
    try:
        err_body = e.read().decode('utf-8', errors='replace')
        print(f"==> Error details: {err_body}", file=sys.stderr)
    except Exception:
        pass
    sys.exit(1)
except Exception as e:
    print(f"::error::Unexpected exception: {e}", file=sys.stderr)
    sys.exit(1)
EOF

          echo "==> Synthetic incident dispatched successfully!"
          echo "==> Check your Slack channel: #operational-intelligence"
