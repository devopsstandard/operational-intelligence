name: Microservices Build & GitOps Rollout

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'k8s/**'
      - 'gitops/**'
      - 'scripts/**'
      - '.github/workflows/build-and-gitops.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1

jobs:
  validate-k8s:
    name: Validate Kustomize Overlays
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dev Overlay
        run: kubectl kustomize k8s/overlays/dev > /dev/null

  gitops-rollout:
    name: GitOps Rollout & Argo CD Sync
    needs: [validate-k8s]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Dynamic Environment Context
        run: |
          PROJ_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJ_ID" ]; then
            echo "::error::Secret GCP_PROJECT_ID is not configured in GitHub Repository Secrets!"
            exit 1
          fi
          echo "GCP_PROJECT=${PROJ_ID}" >> $GITHUB_ENV

          PROJ_NUM="${{ secrets.GCP_PROJECT_NUMBER }}"
          echo "GCP_PROJECT_NUMBER=${PROJ_NUM}" >> $GITHUB_ENV

          ENV_INPUT="${{ github.event.inputs.environment }}"
          if [ -n "$ENV_INPUT" ]; then
            ENV_NAME="$ENV_INPUT"
          else
            ENV_NAME="${{ github.ref_name == 'dev' && 'dev' || 'dev' }}"
          fi
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "GKE_CLUSTER=omnipulse-gke-cluster-${ENV_NAME}" >> $GITHUB_ENV

          # Support direct WIF_PROVIDER secret or dynamically build from GCP_PROJECT_NUMBER
          CUSTOM_WIF="${{ secrets.WIF_PROVIDER }}"
          if [ -n "$CUSTOM_WIF" ]; then
            echo "WIF_PROVIDER=${CUSTOM_WIF}" >> $GITHUB_ENV
          elif [ -n "$PROJ_NUM" ]; then
            echo "WIF_PROVIDER=projects/${PROJ_NUM}/locations/global/workloadIdentityPools/github-actions-pool-${ENV_NAME}/providers/github-actions-provider" >> $GITHUB_ENV
          fi

          CUSTOM_SA="${{ secrets.WIF_SERVICE_ACCOUNT }}"
          if [ -n "$CUSTOM_SA" ]; then
            echo "WIF_SERVICE_ACCOUNT=${CUSTOM_SA}" >> $GITHUB_ENV
          else
            echo "WIF_SERVICE_ACCOUNT=omnipulse-cicd-sa-${ENV_NAME}@${PROJ_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
          fi

      - name: Authenticate to GCP (WIF with SA Key Fallback)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_SA_KEY == '' && env.WIF_PROVIDER || '' }}
          service_account: ${{ secrets.GCP_SA_KEY == '' && env.WIF_SERVICE_ACCOUNT || '' }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Sync GitOps Applications & Clean Test Workloads
        run: |
          echo "==> Ensuring required namespaces exist..."
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace opentelemetry --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace omnipulse-${ENV_NAME} --dry-run=client -o yaml | kubectl apply -f -

          echo "==> Installing Prometheus Operator CRDs via server-side apply..."
          kubectl apply --server-side --force-conflicts -k k8s/crds

          echo "==> Syncing all GitOps application manifests to Argo CD..."
          kubectl apply -f gitops/argocd-apps/ -n argocd

          echo "==> Applying OpenTelemetry & Grafana Ingress manifests..."
          kubectl apply -k k8s/otel
          kubectl rollout restart deployment otel-collector -n opentelemetry || true
          kubectl apply -k k8s/grafana-ingress

          echo "==> Applying Kustomize microservices manifests for ${ENV_NAME}..."
          kubectl apply -k k8s/overlays/${ENV_NAME}

          echo "==> Deploying in-cluster BigQuery Auditor to namespace robusta..."
          kubectl apply -f k8s/robusta/auditor.yaml
          kubectl rollout restart deployment robusta-bigquery-auditor -n robusta || true

          echo "==> Waiting for emailservice rollout to complete..."
          kubectl rollout status deployment/emailservice -n omnipulse-${ENV_NAME} --timeout=360s || (echo "==> Rollout progressing; current status:" && kubectl get pods -n omnipulse-${ENV_NAME} -l app=emailservice)
          echo "==> Done! GitOps applications synced successfully via GitHub Actions."

      - name: Automatically Record Remediation Event to BigQuery Audit Log
        run: |
          echo "==> Automatically recording SRE remediation event to BigQuery..."
          ROBUSTA_POD=$(kubectl get pods -n robusta -l app=robusta-runner -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$ROBUSTA_POD" ]; then
            kubectl exec -i -n robusta "$ROBUSTA_POD" -- python3 - "${GITHUB_SHA}" "${ENV_NAME}" "emailservice" "GITOPS_PROACTIVE_REMEDIATION" < scripts/record_bigquery_audit.py
          fi
          echo "==> BigQuery audit logging complete."
