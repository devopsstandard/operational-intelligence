name: End-to-End Autonomous Incident Simulation & Verification

on:
  workflow_dispatch:
    inputs:
      failure_mode:
        description: 'Operational Failure Mode to Simulate'
        required: true
        default: 'ConsumerTriageStalled'
        type: choice
        options:
          - ConsumerTriageStalled
          - ContainerMemoryNearLimit
          - ContainerCPUNearLimit
          - FrontendHTTP5xxRateHigh
          - PubSubDLQBackpressure
          - VertexAIQuotaExhausted
          - CrashLoopBackOff
      target_workload:
        description: 'Target Deployment'
        required: true
        default: 'emailservice'
        type: choice
        options:
          - emailservice
          - paymentservice
          - frontend
          - recommendationservice
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a

jobs:
  simulate-and-verify:
    name: Simulate Incident & Verify Remediation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Dynamic Environment Context
        run: |
          PROJ_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJ_ID" ]; then
            echo "::error::Secret GCP_PROJECT_ID is not configured in GitHub Repository Secrets!"
            exit 1
          fi
          echo "GCP_PROJECT=${PROJ_ID}" >> $GITHUB_ENV

          PROJ_NUM="${{ secrets.GCP_PROJECT_NUMBER }}"
          echo "GCP_PROJECT_NUMBER=${PROJ_NUM}" >> $GITHUB_ENV

          ENV_NAME="${{ github.event.inputs.environment }}"
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "GKE_CLUSTER=omnipulse-gke-cluster-${ENV_NAME}" >> $GITHUB_ENV

          CUSTOM_WIF="${{ secrets.WIF_PROVIDER }}"
          if [ -n "$CUSTOM_WIF" ]; then
            echo "WIF_PROVIDER=${CUSTOM_WIF}" >> $GITHUB_ENV
          elif [ -n "$PROJ_NUM" ]; then
            echo "WIF_PROVIDER=projects/${PROJ_NUM}/locations/global/workloadIdentityPools/github-actions-pool-${ENV_NAME}/providers/github-actions-provider" >> $GITHUB_ENV
          fi

          CUSTOM_SA="${{ secrets.WIF_SERVICE_ACCOUNT }}"
          if [ -n "$CUSTOM_SA" ]; then
            echo "WIF_SERVICE_ACCOUNT=${CUSTOM_SA}" >> $GITHUB_ENV
          else
            echo "WIF_SERVICE_ACCOUNT=omnipulse-cicd-sa-${ENV_NAME}@${PROJ_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
          fi

      - name: Authenticate to GCP (WIF with SA Key Fallback)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_SA_KEY == '' && env.WIF_PROVIDER || '' }}
          service_account: ${{ secrets.GCP_SA_KEY == '' && env.WIF_SERVICE_ACCOUNT || '' }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_ZONE }}

      - name: Ensure In-Cluster BigQuery Auditor is Active
        run: |
          echo "==> Ensuring robusta-bigquery-auditor service is deployed..."
          kubectl apply -f k8s/robusta/auditor.yaml

      - name: 1. Inject Prometheus Alert into Robusta Engine
        run: |
          echo "==> Finding Robusta runner pod..."
          ROBUSTA_POD=$(kubectl get pods -n robusta -l app=robusta-runner -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$ROBUSTA_POD" ]; then
            echo "::error::Robusta runner pod not found in namespace 'robusta'!"
            exit 1
          fi
          echo "==> In-cluster Robusta Runner Pod: $ROBUSTA_POD"

          echo "==> Injecting Alertmanager incident event for '${{ github.event.inputs.failure_mode }}' on '${{ github.event.inputs.target_workload }}'..."
          kubectl exec -i -n robusta "$ROBUSTA_POD" -- python3 - <<EOF
          import urllib.request, json, datetime

          payload = {
              "status": "firing",
              "receiver": "robusta",
              "alerts": [
                  {
                      "status": "firing",
                      "labels": {
                          "alertname": "${{ github.event.inputs.failure_mode }}",
                          "severity": "critical",
                          "deployment": "${{ github.event.inputs.target_workload }}",
                          "namespace": "omnipulse-${{ env.ENV_NAME }}"
                      },
                      "annotations": {
                          "summary": "Proactive detection: ${{ github.event.inputs.failure_mode }} on ${{ github.event.inputs.target_workload }}",
                          "description": "Streaming consumer watchdog detected anomaly; automated self-healing triggered."
                      },
                      "startsAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "endsAt": "0001-01-01T00:00:00Z"
                  }
              ]
          }

          req = urllib.request.Request(
              "http://127.0.0.1:5000/api/alerts",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              resp = urllib.request.urlopen(req)
              print(f"==> Alertmanager webhook received by Robusta: HTTP {resp.status}")
          except Exception as e:
              print(f"==> Error dispatching alert to Robusta: {e}")
              raise e
          EOF

      - name: 2. Observe Real-Time Autonomous Remediation
        run: |
          TARGET="${{ github.event.inputs.target_workload }}"
          NS="omnipulse-${ENV_NAME}"
          echo "==> Monitoring autonomous rollout restart on ${TARGET} in namespace ${NS}..."
          sleep 5
          kubectl rollout status deployment/${TARGET} -n ${NS} --timeout=360s || (echo "==> Pod status under GKE Autopilot:" && kubectl get pods -n ${NS} -l app=${TARGET})
          echo "==> Autonomous remediation observed and completed successfully!"

      - name: 3. Record Immutable Audit Record to BigQuery
        run: |
          ROBUSTA_POD=$(kubectl get pods -n robusta -l app=robusta-runner -o jsonpath='{.items[0].metadata.name}')
          echo "==> Logging immutable remediation audit trail to BigQuery dataset ops_analytics_prod..."
          kubectl exec -i -n robusta "$ROBUSTA_POD" -- python3 - "${GITHUB_SHA}" "${ENV_NAME}" "${{ github.event.inputs.target_workload }}" "${{ github.event.inputs.failure_mode }}" < scripts/record_bigquery_audit.py
          echo "==> Verification drill complete. Check Slack channel #operational-intelligence for real-time incident and remediation alerts."
