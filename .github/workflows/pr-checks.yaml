name: PR Validation & Supply-Chain Checks

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks-secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Open Source Secret Scanner)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --verbose --redact

  docker-lint:
    name: Dockerfile Linting (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Hadolint
        run: |
          sudo wget -q -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Microservice Dockerfiles
        run: |
          echo "==> Scanning all microservice Dockerfiles..."
          find src -name Dockerfile -exec echo "Linting: {}" \; -exec hadolint --failure-threshold error --ignore DL3006 --ignore DL3008 --ignore DL3018 --ignore DL3025 --ignore DL3042 --ignore DL3045 {} +

  terraform-validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init & Validate (Dev)
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Terraform Init & Validate (Prod)
        run: |
          cd terraform/environments/prod
          terraform init -backend=false
          terraform validate

  kustomize-lint:
    name: Kustomize Manifest Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Kustomize Dev Overlay
        run: kubectl kustomize k8s/overlays/dev > /dev/null

      - name: Build Kustomize Prod Overlay
        run: kubectl kustomize k8s/overlays/prod > /dev/null

  sonarqube-sast:
    name: SonarQube SAST & Quality Gate (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarCloud Token Configuration
        id: check-token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::warning::SONAR_TOKEN is not configured in GitHub Secrets. Skipping SonarCloud scan. Add SONAR_TOKEN to GitHub Secrets to enable SAST code analysis."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: SonarCloud Scan
        if: steps.check-token.outputs.configured == 'true'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

