# SonarCloud Project Configuration
# Documentation: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

# Project Identification
sonar.projectKey=devopsstandard_operational-intelligence
sonar.organization=devopsstandard

# Project Metadata
sonar.projectName=Operational Intelligence Platform
sonar.projectVersion=1.0

# Source Code Paths
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Inclusions and Exclusions
# Exclude auto-generated code, protobuf artifacts, build tooling and dependencies
sonar.exclusions=**/vendor/**,**/node_modules/**,**/*.pb.go,**/*_pb2.py,**/gradle/**,**/.gradle/**,**/bin/**,**/obj/**,**/*.min.js,**/genproto/**

# Test File Patterns
sonar.tests=src
sonar.test.inclusions=**/*_test.go,**/*Test.java,**/*.spec.js,**/*_test.py
